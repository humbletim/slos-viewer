name: Noise Test Harness QA

on:
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang
          - os: macos-latest
            compiler: clang
          - os: windows-latest
            compiler: msvc
          - os: windows-latest
            compiler: clang

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC for Windows
      if: matrix.compiler == 'msvc'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Compile and Test
      shell: bash
      run: |
        # Set compiler based on matrix
        if [ "${{ matrix.compiler }}" == "gcc" ]; then
          CXX="g++"
        elif [ "${{ matrix.compiler }}" == "clang" ]; then
          CXX="clang++"
        elif [ "${{ matrix.compiler }}" == "msvc" ]; then
          # This shell is bash, but cl.exe is in the PATH from setup-msvc
          CXX="cl.exe"
        fi

        # Determine OS-specific details
        EXE_EXT=""
        if [ "${{ runner.os }}" == "Windows" ]; then
          EXE_EXT=".exe"
        fi

        # Create output directory for artifacts
        mkdir -p results

        # --- NATIVE MODE ---
        echo "--- Compiling Native Mode (${{ matrix.compiler }}) ---"
        if [ "${{ matrix.compiler }}" == "msvc" ]; then
          $CXX /std:c++11 /Inoise_test/mocks noise_test/main.cpp /Femain_native$EXE_EXT
        else
          $CXX -std=c++11 -Inoise_test/mocks noise_test/main.cpp -o main_native$EXE_EXT
        fi

        echo "--- Running Native Mode ---"
        ./main_native$EXE_EXT > results/actual_native.txt

        echo "--- Comparing Native Mode ---"
        # Use fc on windows, diff otherwise. Mute output, we only care about exit code.
        # diff returns 0 for match, 1 for mismatch. fc returns 0 for match, non-zero for mismatch.
        if [ "${{ runner.os }}" == "Windows" ]; then
          fc /W results/actual_native.txt noise_test/standard_cypher.txt > nul
        else
          diff -b results/actual_native.txt noise_test/standard_cypher.txt > /dev/null
        fi

        if [ $? -eq 0 ]; then
          echo "✅ Match" > results/result_native.txt
        else
          echo "❌ Mismatch" > results/result_native.txt
        fi
        cat results/result_native.txt

        # --- FIXED MODE ---
        echo "--- Compiling Fixed Mode (${{ matrix.compiler }}) ---"
        if [ "${{ matrix.compiler }}" == "msvc" ]; then
          $CXX /std:c++11 /Inoise_test/mocks /DUSE_MSVC_COMPAT noise_test/main.cpp /Femain_fixed$EXE_EXT
        else
          $CXX -std=c++11 -Inoise_test/mocks -DUSE_MSVC_COMPAT noise_test/main.cpp -o main_fixed$EXE_EXT
        fi

        echo "--- Running Fixed Mode ---"
        ./main_fixed$EXE_EXT > results/actual_fixed.txt

        echo "--- Comparing Fixed Mode ---"
        if [ "${{ runner.os }}" == "Windows" ]; then
          fc /W results/actual_fixed.txt noise_test/standard_cypher.txt > nul
        else
          diff -b results/actual_fixed.txt noise_test/standard_cypher.txt > /dev/null
        fi

        if [ $? -eq 0 ]; then
          echo "✅ Match" > results/result_fixed.txt
        else
          echo "❌ Mismatch" > results/result_fixed.txt
        fi
        cat results/result_fixed.txt

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: results-${{ matrix.os }}-${{ matrix.compiler }}
        path: results/

  generate_report:
    runs-on: ubuntu-latest
    needs: build_and_test
    if: always()

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: all-artifacts

    - name: Generate Report
      shell: bash
      run: |
        echo "### Noise Test Harness Report" >> $GITHUB_STEP_SUMMARY
        echo "| Platform | Compiler | Native CRT Mode | MSVC Compat Mode |" >> $GITHUB_STEP_SUMMARY
        echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY

        # Loop through each downloaded artifact directory
        for dir in all-artifacts/*/; do
          # Extract os and compiler from directory name 'results-os-compiler'
          dirname=$(basename "$dir")
          platform=$(echo "$dirname" | cut -d'-' -f2)
          compiler=$(echo "$dirname" | cut -d'-' -f3)

          native_result_file="${dir}result_native.txt"
          fixed_result_file="${dir}result_fixed.txt"

          # Check if result files exist to avoid errors
          if [ -f "$native_result_file" ] && [ -f "$fixed_result_file" ]; then
            native_result=$(cat "$native_result_file")
            fixed_result=$(cat "$fixed_result_file")
            echo "| **$platform** | \`$compiler\` | $native_result | $fixed_result |" >> $GITHUB_STEP_SUMMARY
          fi
        done
